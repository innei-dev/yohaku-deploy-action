name: Build and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 3,5'
  repository_dispatch:
    types: [trigger-workflow]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  SOURCE_REPO: innei-dev/Yohaku

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}

    outputs:
      hash_content: ${{ steps.read_hash.outputs.hash_content }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read HASH_FILE content
        id: read_hash
        run: |
          content=$(cat ${{ env.HASH_FILE }}) || true
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

  check:
    name: Check Should Rebuild
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      canceled: ${{ steps.use_content.outputs.canceled }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Use content from prev job and compare
        id: use_content
        env:
          FILE_HASH: ${{ needs.prepare.outputs.hash_content }}
        run: |
          file_hash=$FILE_HASH
          current_hash=$(git rev-parse --short HEAD)
          echo "File Hash: $file_hash"
          echo "Current Git Hash: $current_hash"
          if [ "$file_hash" == "$current_hash" ]; then
            echo "Hashes match. Stopping workflow."
            echo "canceled=true" >> $GITHUB_OUTPUT
          else
            echo "Hashes do not match. Continuing workflow."
          fi

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.canceled != 'true' }}

    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            yohaku:latest
            yohaku:${{ github.sha }}
          build-args: |
            BASE_URL=${{ secrets.BASE_URL }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            GH_TOKEN=${{ secrets.GH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Store short SHA
        id: sha
        run: |
          sha_short=$(git rev-parse --short HEAD)
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

      - name: Save image
        run: |
          mkdir -p deploy
          docker save yohaku:latest | gzip > deploy/yohaku-image.tar.gz

      - name: Copy image to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: deploy/yohaku-image.tar.gz
          target: /tmp/yohaku-deploy
          strip_components: 1
          timeout: 10m

      - name: Deploy on server
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 5m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            docker load < /tmp/yohaku-deploy/yohaku-image.tar.gz

            docker stop yohaku 2>/dev/null || true
            docker rm yohaku 2>/dev/null || true

            docker run -d \
              --name yohaku \
              --restart always \
              -p 2323:2323 \
              -v $HOME/yohaku/.env:/app/.env \
              yohaku:latest

            # Retain image for rollback
            mkdir -p $HOME/yohaku/images
            cp /tmp/yohaku-deploy/yohaku-image.tar.gz \
              $HOME/yohaku/images/yohaku-${{ github.sha }}.tar.gz
            # Keep only last 2 images
            ls -t $HOME/yohaku/images/yohaku-*.tar.gz 2>/dev/null \
              | tail -n +3 | xargs -r rm

            rm -rf /tmp/yohaku-deploy
            docker image prune -f

            echo "Deployed yohaku:${{ github.sha }}"

      - name: After deploy script
        run: |
          hash=${{ steps.sha.outputs.sha_short }}
          ${{ secrets.AFTER_DEPLOY_SCRIPT }}

  store:
    name: Store artifact commit version
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write hash to file
        env:
          SHA_SHORT: ${{ needs.build-and-deploy.outputs.sha_short }}
        run: echo $SHA_SHORT > ${{ env.HASH_FILE }}

      - name: Commit files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ env.HASH_FILE }}
          git commit -a -m "Update hash file"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  notify:
    name: Send WeChat Notification
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always() && needs.build-and-deploy.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Get commit SHA
        id: sha
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Send PushPlus notification
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
          SHA_SHORT: ${{ steps.sha.outputs.sha_short }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN not set, skipping notification"
            exit 0
          fi

          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="成功"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="失败"
          fi

          case "$TRIGGER_EVENT" in
            push) TRIGGER_TEXT="代码推送" ;;
            schedule) TRIGGER_TEXT="定时触发" ;;
            repository_dispatch) TRIGGER_TEXT="手动触发" ;;
            *) TRIGGER_TEXT="$TRIGGER_EVENT" ;;
          esac

          CONTENT="## Yohaku 部署 ${STATUS_TEXT}

          | 项目 | 内容 |
          |------|------|
          | 状态 | ${STATUS_ICON} ${STATUS_TEXT} |
          | 版本 | \`${SHA_SHORT}\` |
          | 触发方式 | ${TRIGGER_TEXT} |
          | 运行编号 | #${RUN_NUMBER} |
          | 时间 | $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') |

          [查看 GitHub Actions 运行详情](${RUN_URL})"

          PAYLOAD=$(jq -n \
            --arg token "$PUSHPLUS_TOKEN" \
            --arg title "Yohaku 部署 ${STATUS_TEXT}" \
            --arg content "$CONTENT" \
            --arg template "markdown" \
            '{token: $token, title: $title, content: $content, template: $template}')

          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          echo ""
          echo "PushPlus notification sent"
