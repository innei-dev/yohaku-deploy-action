name: Build and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 3,5'
  workflow_dispatch:
  repository_dispatch:
    types: [trigger-workflow]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  SOURCE_REPO: innei-dev/Yohaku

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}

    outputs:
      hash_content: ${{ steps.read_hash.outputs.hash_content }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read HASH_FILE content
        id: read_hash
        run: |
          content=$(cat ${{ env.HASH_FILE }}) || true
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

  check:
    name: Check Should Rebuild
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      canceled: ${{ steps.use_content.outputs.canceled }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Use content from prev job and compare
        id: use_content
        env:
          FILE_HASH: ${{ needs.prepare.outputs.hash_content }}
        run: |
          file_hash=$FILE_HASH
          current_hash=$(git rev-parse --short HEAD)
          echo "File Hash: $file_hash"
          echo "Current Git Hash: $current_hash"
          if [ "$file_hash" == "$current_hash" ]; then
            echo "Hashes match. Stopping workflow."
            echo "canceled=true" >> $GITHUB_OUTPUT
          else
            echo "Hashes do not match. Continuing workflow."
          fi

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.canceled != 'true' }}

    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}
      build_result: ${{ steps.build.conclusion }}
      save_result: ${{ steps.save.conclusion }}
      scp_result: ${{ steps.scp.conclusion }}
      deploy_result: ${{ steps.deploy.conclusion }}
      total_duration: ${{ steps.results.outputs.total_duration }}
      image_size: ${{ steps.results.outputs.image_size }}
      build_duration: ${{ steps.results.outputs.build_duration }}
      save_duration: ${{ steps.results.outputs.save_duration }}
      scp_duration: ${{ steps.results.outputs.scp_duration }}
      deploy_duration: ${{ steps.results.outputs.deploy_duration }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Start timing
        id: timing
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            yohaku:latest
            yohaku:${{ github.sha }}
          build-args: |
            BASE_URL=${{ secrets.BASE_URL }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            GH_TOKEN=${{ secrets.GH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record build end
        id: timing_build_end
        if: always()
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Store short SHA
        id: sha
        run: |
          sha_short=$(git rev-parse --short HEAD)
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

      - name: Save image
        id: save
        run: |
          mkdir -p deploy
          docker save yohaku:latest | gzip > deploy/yohaku-image.tar.gz

      - name: Record save end
        id: timing_save_end
        if: always()
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Copy image to server
        id: scp
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: deploy/yohaku-image.tar.gz
          target: /tmp/yohaku-deploy
          strip_components: 1
          timeout: 10m

      - name: Record scp end
        id: timing_scp_end
        if: always()
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy on server
        id: deploy
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 5m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            docker load < /tmp/yohaku-deploy/yohaku-image.tar.gz

            docker stop yohaku 2>/dev/null || true
            docker rm yohaku 2>/dev/null || true

            docker run -d \
              --name yohaku \
              --restart always \
              -p 2323:2323 \
              -v $HOME/yohaku/.env:/app/.env \
              yohaku:latest

            # Retain image for rollback
            mkdir -p $HOME/yohaku/images
            cp /tmp/yohaku-deploy/yohaku-image.tar.gz \
              $HOME/yohaku/images/yohaku-${{ github.sha }}.tar.gz
            # Keep only last 2 images
            ls -t $HOME/yohaku/images/yohaku-*.tar.gz 2>/dev/null \
              | tail -n +3 | xargs -r rm

            rm -rf /tmp/yohaku-deploy
            docker image prune -f

            echo "Deployed yohaku:${{ github.sha }}"
            docker ps --filter name=yohaku --format "{{.Status}}"

      - name: Record deploy end
        id: timing_deploy_end
        if: always()
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Compile results
        id: results
        if: always()
        run: |
          now=$(date +%s)
          start=${{ steps.timing.outputs.start_time }}
          echo "total_duration=$((now - start))" >> "$GITHUB_OUTPUT"
          if [ -f deploy/yohaku-image.tar.gz ]; then
            echo "image_size=$(du -h deploy/yohaku-image.tar.gz | cut -f1)" >> "$GITHUB_OUTPUT"
          fi

          # Phase durations (seconds, from consecutive timing points)
          build_end='${{ steps.timing_build_end.outputs.end }}'
          save_end='${{ steps.timing_save_end.outputs.end }}'
          scp_end='${{ steps.timing_scp_end.outputs.end }}'
          deploy_end='${{ steps.timing_deploy_end.outputs.end }}'

          if [ -n "$build_end" ]; then
            echo "build_duration=$((build_end - start))" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$build_end" ] && [ -n "$save_end" ]; then
            echo "save_duration=$((save_end - build_end))" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$save_end" ] && [ -n "$scp_end" ]; then
            echo "scp_duration=$((scp_end - save_end))" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$scp_end" ] && [ -n "$deploy_end" ]; then
            echo "deploy_duration=$((deploy_end - scp_end))" >> "$GITHUB_OUTPUT"
          fi

      - name: After deploy script
        run: |
          hash=${{ steps.sha.outputs.sha_short }}
          ${{ secrets.AFTER_DEPLOY_SCRIPT }}

  store:
    name: Store artifact commit version
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Write hash to file
        env:
          SHA_SHORT: ${{ needs.build-and-deploy.outputs.sha_short }}
        run: echo $SHA_SHORT > ${{ env.HASH_FILE }}

      - name: Commit files
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add ${{ env.HASH_FILE }}
          git commit -a -m "Update hash file"

      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}

  notify:
    name: Send WeChat Notification
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always() && needs.build-and-deploy.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=format:'%s' > /tmp/commit_msg.txt

      - name: Send PushPlus notification
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
          SHA_SHORT: ${{ steps.commit.outputs.sha_short }}
          BUILD_RESULT: ${{ needs.build-and-deploy.outputs.build_result }}
          SAVE_RESULT: ${{ needs.build-and-deploy.outputs.save_result }}
          SCP_RESULT: ${{ needs.build-and-deploy.outputs.scp_result }}
          DEPLOY_PHASE_RESULT: ${{ needs.build-and-deploy.outputs.deploy_result }}
          TOTAL_DURATION: ${{ needs.build-and-deploy.outputs.total_duration }}
          IMAGE_SIZE: ${{ needs.build-and-deploy.outputs.image_size }}
          BUILD_DURATION: ${{ needs.build-and-deploy.outputs.build_duration }}
          SAVE_DURATION: ${{ needs.build-and-deploy.outputs.save_duration }}
          SCP_DURATION: ${{ needs.build-and-deploy.outputs.scp_duration }}
          DEPLOY_PHASE_DURATION: ${{ needs.build-and-deploy.outputs.deploy_duration }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN not set, skipping notification"
            exit 0
          fi

          # --- Status ---
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="成功"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="失败"
          fi

          # --- Phase icons ---
          phase_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❓" ;;
            esac
          }

          BUILD_ICON=$(phase_icon "$BUILD_RESULT")
          SAVE_ICON=$(phase_icon "$SAVE_RESULT")
          SCP_ICON=$(phase_icon "$SCP_RESULT")
          DEPLOY_ICON=$(phase_icon "$DEPLOY_PHASE_RESULT")

          # --- Trigger text ---
          case "$TRIGGER_EVENT" in
            push)                TRIGGER_TEXT="代码推送" ;;
            schedule)            TRIGGER_TEXT="定时触发" ;;
            workflow_dispatch)   TRIGGER_TEXT="手动运行" ;;
            repository_dispatch) TRIGGER_TEXT="外部触发" ;;
            *)                   TRIGGER_TEXT="$TRIGGER_EVENT" ;;
          esac

          # --- Duration ---
          if [ -n "$TOTAL_DURATION" ]; then
            DURATION_MIN=$((TOTAL_DURATION / 60))
            DURATION_SEC=$((TOTAL_DURATION % 60))
            DURATION_TEXT="${DURATION_MIN}m ${DURATION_SEC}s"
          else
            DURATION_TEXT="N/A"
          fi

          # --- Phase durations ---
          format_duration() {
            if [ -z "$1" ] || [ "$1" = "N/A" ]; then
              echo "N/A"
            else
              m=$(( $1 / 60 ))
              s=$(( $1 % 60 ))
              echo "${m}m ${s}s"
            fi
          }

          BUILD_DURATION_TEXT=$(format_duration "$BUILD_DURATION")
          SAVE_DURATION_TEXT=$(format_duration "$SAVE_DURATION")
          SCP_DURATION_TEXT=$(format_duration "$SCP_DURATION")
          DEPLOY_DURATION_TEXT=$(format_duration "$DEPLOY_PHASE_DURATION")

          # --- Commit message ---
          COMMIT_MSG=$(cat /tmp/commit_msg.txt 2>/dev/null || echo "N/A")

          # --- Build content ---
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          SIZE_HINT="${IMAGE_SIZE:+（${IMAGE_SIZE}）}"

          CONTENT="## Yohaku 部署 ${STATUS_TEXT}

          ### 基本信息
          | 项目 | 内容 |
          |------|------|
          | 状态 | ${STATUS_ICON} ${STATUS_TEXT} |
          | 版本 | \`${SHA_SHORT}\` |
          | 触发方式 | ${TRIGGER_TEXT} |
          | 运行编号 | #${RUN_NUMBER} |
          | 总用时 | ${DURATION_TEXT} |
          | 时间 | ${TIMESTAMP} |

          ### 各阶段结果
          | 阶段 | 结果 | 用时 |
          |------|------|------|
          | Docker 构建 | ${BUILD_ICON} ${BUILD_RESULT} | ${BUILD_DURATION_TEXT} |
          | 镜像打包 | ${SAVE_ICON} ${SAVE_RESULT} ${SIZE_HINT} | ${SAVE_DURATION_TEXT} |
          | 传输到服务器 | ${SCP_ICON} ${SCP_RESULT} | ${SCP_DURATION_TEXT} |
          | 部署启动 | ${DEPLOY_ICON} ${DEPLOY_PHASE_RESULT} | ${DEPLOY_DURATION_TEXT} |

          ### 提交信息
          > ${COMMIT_MSG}

          [查看 GitHub Actions 运行详情](${RUN_URL})"

          # --- Send ---
          PAYLOAD=$(jq -n \
            --arg token "$PUSHPLUS_TOKEN" \
            --arg title "Yohaku 部署 ${STATUS_TEXT}" \
            --arg content "$CONTENT" \
            --arg template "markdown" \
            '{token: $token, title: $title, content: $content, template: $template}')

          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          echo ""
          echo "PushPlus notification sent"
