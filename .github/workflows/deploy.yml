name: Build and Deploy

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * 3,5'
  workflow_dispatch:
    inputs:
      deploy_method:
        description: '部署方式'
        default: 'docker'
        type: choice
        options:
          - docker
          - pm2
  repository_dispatch:
    types: [trigger-workflow]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HASH_FILE: build_hash
  SOURCE_REPO: innei-dev/Yohaku
  DEPLOY_METHOD: docker  # 部署方式：docker 或 pm2。手动运行时可通过下方 workflow_dispatch input 覆盖

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    if: ${{ github.event.head_commit.message != 'Update hash file' }}

    outputs:
      hash_content: ${{ steps.read_hash.outputs.hash_content }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read HASH_FILE content from hash-track branch
        id: read_hash
        run: |
          git fetch origin hash-track 2>/dev/null || true
          content=$(git show origin/hash-track:build_hash 2>/dev/null || echo "")
          echo "hash_content=$content" >> "$GITHUB_OUTPUT"

  check:
    name: Check Should Rebuild
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      canceled: ${{ steps.use_content.outputs.canceled }}

    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Use content from prev job and compare
        id: use_content
        env:
          FILE_HASH: ${{ needs.prepare.outputs.hash_content }}
        run: |
          file_hash=$FILE_HASH
          current_hash=$(git rev-parse --short HEAD)
          echo "File Hash: $file_hash"
          echo "Current Git Hash: $current_hash"
          if [ "$file_hash" == "$current_hash" ]; then
            echo "Hashes match. Stopping workflow."
            echo "canceled=true" >> $GITHUB_OUTPUT
          else
            echo "Hashes do not match. Continuing workflow."
          fi

  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: check
    if: ${{ needs.check.outputs.canceled != 'true' }}

    outputs:
      sha_short: ${{ steps.sha.outputs.sha_short }}
      build_result: ${{ steps.results.outputs.build_result }}
      save_result: ${{ steps.results.outputs.save_result }}
      scp_result: ${{ steps.results.outputs.scp_result }}
      deploy_result: ${{ steps.results.outputs.deploy_result }}
      total_duration: ${{ steps.results.outputs.total_duration }}
      image_size: ${{ steps.results.outputs.image_size }}
      build_duration: ${{ steps.results.outputs.build_duration }}
      save_duration: ${{ steps.results.outputs.save_duration }}
      scp_duration: ${{ steps.results.outputs.scp_duration }}
      deploy_duration: ${{ steps.results.outputs.deploy_duration }}
      deploy_method: ${{ steps.deploy_method.outputs.method }}

    steps:
      # ═══════════════════════════════════════════
      # Common Setup
      # ═══════════════════════════════════════════
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0
          lfs: true
          submodules: recursive

      - name: Checkout LFS objects
        run: git lfs checkout

      - name: Start timing
        id: timing
        run: echo "start_time=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Override deploy method from workflow input
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_method != ''
        run: echo "DEPLOY_METHOD=${{ github.event.inputs.deploy_method }}" >> $GITHUB_ENV

      - name: Record deploy method
        id: deploy_method
        run: echo "method=${DEPLOY_METHOD:-docker}" >> "$GITHUB_OUTPUT"

      - name: Store short SHA
        id: sha
        run: |
          sha_short=$(git rev-parse --short HEAD)
          echo "sha_short=$sha_short" >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════
      # Docker Path
      # ═══════════════════════════════════════════
      - name: Set up Docker Buildx
        if: env.DEPLOY_METHOD == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: env.DEPLOY_METHOD == 'docker'
        id: build_docker
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: |
            yohaku:latest
            yohaku:${{ github.sha }}
          build-args: |
            BASE_URL=${{ secrets.BASE_URL }}
            S3_ACCESS_KEY=${{ secrets.S3_ACCESS_KEY }}
            S3_SECRET_KEY=${{ secrets.S3_SECRET_KEY }}
            WEBHOOK_SECRET=${{ secrets.WEBHOOK_SECRET }}
            TMDB_API_KEY=${{ secrets.TMDB_API_KEY }}
            GH_TOKEN=${{ secrets.GH_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record build end (Docker)
        if: env.DEPLOY_METHOD == 'docker'
        id: timing_build_end
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Save image (Docker)
        if: env.DEPLOY_METHOD == 'docker'
        id: save
        run: |
          mkdir -p deploy
          docker save yohaku:latest | gzip > deploy/yohaku-image.tar.gz

      - name: Record save end (Docker)
        if: env.DEPLOY_METHOD == 'docker'
        id: timing_save_end
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Copy image to server (Docker)
        if: env.DEPLOY_METHOD == 'docker'
        id: scp_docker
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: deploy/yohaku-image.tar.gz
          target: /tmp/yohaku-deploy
          strip_components: 1
          timeout: 10m

      - name: Record scp end (Docker)
        if: env.DEPLOY_METHOD == 'docker'
        id: timing_scp_end
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy via Docker on server
        if: env.DEPLOY_METHOD == 'docker'
        id: deploy_docker
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 5m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            docker load < /tmp/yohaku-deploy/yohaku-image.tar.gz

            docker stop yohaku 2>/dev/null || true
            docker rm yohaku 2>/dev/null || true

            # Source /app/.env so API_URL etc. are available at runtime
            docker run -d \
              --name yohaku \
              --restart always \
              -p 2323:2323 \
              -v $HOME/yohaku/.env:/app/.env \
              yohaku:latest \
              sh -c "set -a; . /app/.env 2>/dev/null || true; set +a; echo 'Mix Space Web [Yohaku] Image.' && node apps/web/server.js"

            # Retain image for rollback
            mkdir -p $HOME/yohaku/images
            cp /tmp/yohaku-deploy/yohaku-image.tar.gz \
              $HOME/yohaku/images/yohaku-${{ github.sha }}.tar.gz
            # Keep only last 2 images
            ls -t $HOME/yohaku/images/yohaku-*.tar.gz 2>/dev/null \
              | tail -n +3 | xargs -r rm

            rm -rf /tmp/yohaku-deploy
            docker image prune -f

            echo "Deployed yohaku:${{ github.sha }}"
            docker ps --filter name=yohaku --format "{{.Status}}"

      - name: Record deploy end (Docker)
        if: env.DEPLOY_METHOD == 'docker'
        id: timing_deploy_end
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════
      # PM2 Path
      # ═══════════════════════════════════════════
      - name: Setup Node.js
        if: env.DEPLOY_METHOD == 'pm2'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        if: env.DEPLOY_METHOD == 'pm2'
        run: npm install -g pnpm@latest

      - name: Install dependencies
        if: env.DEPLOY_METHOD == 'pm2'
        run: pnpm install

      - name: Build standalone
        if: env.DEPLOY_METHOD == 'pm2'
        id: build_pm2
        run: |
          pnpm --filter @yohaku/web build:ci
          mkdir -p deploy
          cd apps/web/.next
          rm -rf cache
          cp -r ../public ./standalone/public
          mv ./static ./standalone/apps/web/.next/static
          cd ./standalone
          echo ';process.title = "Yohaku (NextJS)"' >> server.js
          cd ../..
          zip --symlinks -r ${{ github.workspace }}/deploy/release.zip ./*

      - name: Record build end (PM2)
        if: env.DEPLOY_METHOD == 'pm2'
        id: timing_build_end_pm2
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Record save end (PM2, no save phase)
        if: env.DEPLOY_METHOD == 'pm2'
        id: timing_save_end_pm2
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Copy standalone to server (PM2)
        if: env.DEPLOY_METHOD == 'pm2'
        id: scp_pm2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          source: deploy/release.zip
          target: /tmp/yohaku-deploy
          strip_components: 1
          timeout: 10m

      - name: Record scp end (PM2)
        if: env.DEPLOY_METHOD == 'pm2'
        id: timing_scp_end_pm2
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Deploy via PM2 on server
        if: env.DEPLOY_METHOD == 'pm2'
        id: deploy_pm2
        uses: appleboy/ssh-action@master
        with:
          command_timeout: 5m
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          password: ${{ secrets.PASSWORD }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          script: |
            set -e

            DEPLOY_DIR=$HOME/yohaku
            mkdir -p "$DEPLOY_DIR/standalone"

            # Unzip release
            unzip -o /tmp/yohaku-deploy/release.zip -d "$DEPLOY_DIR/standalone"

            # Copy pm2 ecosystem config
            cp "$DEPLOY_DIR/ecosystem.config.js" "$DEPLOY_DIR/standalone/ecosystem.config.js" 2>/dev/null || true

            # Install sharp if missing
            cd "$DEPLOY_DIR/standalone"
            npm install sharp 2>/dev/null || true

            # Restart via pm2
            pm2 restart "$DEPLOY_DIR/standalone/ecosystem.config.js" 2>/dev/null || \
              pm2 start "$DEPLOY_DIR/standalone/ecosystem.config.js"

            pm2 save

            echo "Deployed yohaku:${{ github.sha }} via PM2"
            pm2 list --no-color | head -5

      - name: Record deploy end (PM2)
        if: env.DEPLOY_METHOD == 'pm2'
        id: timing_deploy_end_pm2
        run: echo "end=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ═══════════════════════════════════════════
      # Common Finish
      # ═══════════════════════════════════════════
      - name: Compile results
        id: results
        if: always()
        run: |
          now=$(date +%s)
          start=${{ steps.timing.outputs.start_time }}
          echo "total_duration=$((now - start))" >> "$GITHUB_OUTPUT"
          if [ -f deploy/yohaku-image.tar.gz ]; then
            echo "image_size=$(du -h deploy/yohaku-image.tar.gz | cut -f1)" >> "$GITHUB_OUTPUT"
          fi

          # Step results based on deploy method
          DEPLOY_METHOD="${{ env.DEPLOY_METHOD }}"
          if [ "$DEPLOY_METHOD" = "pm2" ]; then
            echo "build_result=${{ steps.build_pm2.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "scp_result=${{ steps.scp_pm2.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "deploy_result=${{ steps.deploy_pm2.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "save_result=skipped" >> "$GITHUB_OUTPUT"
          else
            echo "build_result=${{ steps.build_docker.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "save_result=${{ steps.save.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "scp_result=${{ steps.scp_docker.conclusion }}" >> "$GITHUB_OUTPUT"
            echo "deploy_result=${{ steps.deploy_docker.conclusion }}" >> "$GITHUB_OUTPUT"
          fi

          # Phase durations based on deploy method
          if [ "$DEPLOY_METHOD" = "pm2" ]; then
            build_end='${{ steps.timing_build_end_pm2.outputs.end }}'
            save_end='${{ steps.timing_save_end_pm2.outputs.end }}'
            scp_end='${{ steps.timing_scp_end_pm2.outputs.end }}'
            deploy_end='${{ steps.timing_deploy_end_pm2.outputs.end }}'
          else
            build_end='${{ steps.timing_build_end.outputs.end }}'
            save_end='${{ steps.timing_save_end.outputs.end }}'
            scp_end='${{ steps.timing_scp_end.outputs.end }}'
            deploy_end='${{ steps.timing_deploy_end.outputs.end }}'
          fi

          if [ -n "$build_end" ]; then
            echo "build_duration=$((build_end - start))" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$build_end" ] && [ -n "$save_end" ]; then
            echo "save_duration=$((save_end - build_end))" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$save_end" ] && [ -n "$scp_end" ]; then
            echo "scp_duration=$((scp_end - save_end))" >> "$GITHUB_OUTPUT"
          fi
          if [ -n "$scp_end" ] && [ -n "$deploy_end" ]; then
            echo "deploy_duration=$((deploy_end - scp_end))" >> "$GITHUB_OUTPUT"
          fi

      - name: After deploy script
        run: |
          hash=${{ steps.sha.outputs.sha_short }}
          ${{ secrets.AFTER_DEPLOY_SCRIPT }}

  store:
    name: Store artifact commit version
    runs-on: ubuntu-latest
    needs: build-and-deploy
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Create or switch to hash-track branch
        run: |
          git fetch origin hash-track 2>/dev/null || true
          if git rev-parse origin/hash-track >/dev/null 2>&1; then
            git checkout -b hash-track origin/hash-track
          else
            git checkout --orphan hash-track
            git rm -rf .
          fi

      - name: Write hash to file
        env:
          SHA_SHORT: ${{ needs.build-and-deploy.outputs.sha_short }}
        run: echo $SHA_SHORT > ${{ env.HASH_FILE }}

      - name: Commit and push
        env:
          SHA_SHORT: ${{ needs.build-and-deploy.outputs.sha_short }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git
          git add build_hash
          if ! git diff --cached --quiet; then
            git commit -m "Update hash file to $SHA_SHORT"
            git push origin hash-track
          fi

  notify:
    name: Send WeChat Notification
    runs-on: ubuntu-latest
    needs: build-and-deploy
    if: always() && needs.build-and-deploy.result != 'skipped'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 1

      - name: Get commit info
        id: commit
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          git log -1 --pretty=format:'%s' > /tmp/commit_msg.txt

      - name: Send PushPlus notification
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          DEPLOY_RESULT: ${{ needs.build-and-deploy.result }}
          DEPLOY_METHOD: ${{ needs.build-and-deploy.outputs.deploy_method }}
          SHA_SHORT: ${{ steps.commit.outputs.sha_short }}
          BUILD_RESULT: ${{ needs.build-and-deploy.outputs.build_result }}
          SAVE_RESULT: ${{ needs.build-and-deploy.outputs.save_result }}
          SCP_RESULT: ${{ needs.build-and-deploy.outputs.scp_result }}
          DEPLOY_PHASE_RESULT: ${{ needs.build-and-deploy.outputs.deploy_result }}
          TOTAL_DURATION: ${{ needs.build-and-deploy.outputs.total_duration }}
          IMAGE_SIZE: ${{ needs.build-and-deploy.outputs.image_size }}
          BUILD_DURATION: ${{ needs.build-and-deploy.outputs.build_duration }}
          SAVE_DURATION: ${{ needs.build-and-deploy.outputs.save_duration }}
          SCP_DURATION: ${{ needs.build-and-deploy.outputs.scp_duration }}
          DEPLOY_PHASE_DURATION: ${{ needs.build-and-deploy.outputs.deploy_duration }}
          TRIGGER_EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$PUSHPLUS_TOKEN" ]; then
            echo "PUSHPLUS_TOKEN not set, skipping notification"
            exit 0
          fi

          # --- Status ---
          if [ "$DEPLOY_RESULT" = "success" ]; then
            STATUS_ICON="✅"
            STATUS_TEXT="成功"
          else
            STATUS_ICON="❌"
            STATUS_TEXT="失败"
          fi

          # --- Phase icons ---
          phase_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              *)       echo "❓" ;;
            esac
          }

          BUILD_ICON=$(phase_icon "$BUILD_RESULT")
          SAVE_ICON=$(phase_icon "$SAVE_RESULT")
          SCP_ICON=$(phase_icon "$SCP_RESULT")
          DEPLOY_ICON=$(phase_icon "$DEPLOY_PHASE_RESULT")

          # --- Trigger text ---
          case "$TRIGGER_EVENT" in
            push)                TRIGGER_TEXT="代码推送" ;;
            schedule)            TRIGGER_TEXT="定时触发" ;;
            workflow_dispatch)   TRIGGER_TEXT="手动运行" ;;
            repository_dispatch) TRIGGER_TEXT="外部触发" ;;
            *)                   TRIGGER_TEXT="$TRIGGER_EVENT" ;;
          esac

          # --- Duration ---
          if [ -n "$TOTAL_DURATION" ]; then
            DURATION_MIN=$((TOTAL_DURATION / 60))
            DURATION_SEC=$((TOTAL_DURATION % 60))
            DURATION_TEXT="${DURATION_MIN}m ${DURATION_SEC}s"
          else
            DURATION_TEXT="N/A"
          fi

          # --- Phase durations ---
          format_duration() {
            if [ -z "$1" ] || [ "$1" = "N/A" ]; then
              echo "N/A"
            else
              m=$(( $1 / 60 ))
              s=$(( $1 % 60 ))
              echo "${m}m ${s}s"
            fi
          }

          BUILD_DURATION_TEXT=$(format_duration "$BUILD_DURATION")
          SAVE_DURATION_TEXT=$(format_duration "$SAVE_DURATION")
          SCP_DURATION_TEXT=$(format_duration "$SCP_DURATION")
          DEPLOY_DURATION_TEXT=$(format_duration "$DEPLOY_PHASE_DURATION")

          # --- Commit message ---
          COMMIT_MSG=$(cat /tmp/commit_msg.txt 2>/dev/null || echo "N/A")

          # --- Build phase rows ---
          if [ "$DEPLOY_METHOD" = "pm2" ]; then
            PHASE_ROWS="\
          | 构建 | ${BUILD_ICON} ${BUILD_RESULT} | ${BUILD_DURATION_TEXT} |
          | 部署启动 | ${DEPLOY_ICON} ${DEPLOY_PHASE_RESULT} | ${DEPLOY_PHASE_DURATION} |"
          else
            PHASE_ROWS="\
          | Docker 构建 | ${BUILD_ICON} ${BUILD_RESULT} | ${BUILD_DURATION_TEXT} |
          | 镜像打包 | ${SAVE_ICON} ${SAVE_RESULT} ${SIZE_HINT} | ${SAVE_DURATION_TEXT} |
          | 传输到服务器 | ${SCP_ICON} ${SCP_RESULT} | ${SCP_DURATION_TEXT} |
          | 部署启动 | ${DEPLOY_ICON} ${DEPLOY_PHASE_RESULT} | ${DEPLOY_DURATION_TEXT} |"
          fi

          # --- Build content ---
          TIMESTAMP=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S')
          SIZE_HINT="${IMAGE_SIZE:+（${IMAGE_SIZE}）}"

          CONTENT="## Yohaku 部署 ${STATUS_TEXT}

          ### 基本信息
          | 项目 | 内容 |
          |------|------|
          | 状态 | ${STATUS_ICON} ${STATUS_TEXT} |
          | 版本 | \`${SHA_SHORT}\` |
          | 触发方式 | ${TRIGGER_TEXT} |
          | 运行编号 | #${RUN_NUMBER} |
          | 部署方式 | ${DEPLOY_METHOD} |
          | 总用时 | ${DURATION_TEXT} |
          | 时间 | ${TIMESTAMP} |

          ### 各阶段结果
          | 阶段 | 结果 | 用时 |
          |------|------|------|
          ${PHASE_ROWS}

          ### 提交信息
          > ${COMMIT_MSG}

          [查看 GitHub Actions 运行详情](${RUN_URL})"

          # --- Send ---
          PAYLOAD=$(jq -n \
            --arg token "$PUSHPLUS_TOKEN" \
            --arg title "Yohaku 部署 ${STATUS_TEXT}" \
            --arg content "$CONTENT" \
            --arg template "markdown" \
            '{token: $token, title: $title, content: $content, template: $template}')

          curl -s -X POST "https://www.pushplus.plus/send" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD"

          echo ""
          echo "PushPlus notification sent"
